<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little One's Growth Timeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌸 My Little One's Growth Timeline 🌸</h1>
            <p class="birth-date">Born: March 2023</p>
        </header>

        <div class="timeline-container">
            <div id="timeline" class="timeline"></div>
        </div>

        <!-- Modal for adding/editing entries -->
        <div id="entryModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Add Entry</h2>
                <form id="entryForm">
                    <div class="form-group">
                        <label for="entryMonth">Month:</label>
                        <select id="entryMonth" required>
                            <option value="">Select Month</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="entryYear">Year:</label>
                        <input type="number" id="entryYear" min="2023" max="2100" required>
                    </div>
                    <div class="form-group">
                        <label for="entryNote">Note:</label>
                        <textarea id="entryNote" rows="4" placeholder="Write about this special moment..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="entryPhotos">Photos:</label>
                        <input type="file" id="entryPhotos" multiple accept="image/*">
                        <div id="photoPreview" class="photo-preview"></div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Entry</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Entry Detail Modal -->
        <div id="detailModal" class="modal">
            <div class="modal-content">
                <span class="close-detail">&times;</span>
                <h2 id="detailTitle"></h2>
                <div id="detailContent"></div>
            </div>
        </div>
    </div>
	
    <script src="cloudinary-config.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
